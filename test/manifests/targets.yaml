apiVersion: v1
kind: Service
metadata:
  name: broadcast-target-svc
  namespace: goxang-broadcast-test
spec:
  selector:
    app: broadcast-target
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broadcast-target-1
  namespace: goxang-broadcast-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broadcast-target
      target-id: "1"
  template:
    metadata:
      labels:
        app: broadcast-target
        target-id: "1"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: target
          image: goxang/broadcast-target:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
---
