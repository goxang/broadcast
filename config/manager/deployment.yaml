apiVersion: apps/v1
kind: Deployment
metadata:
  name: broadcast
  namespace: goxang-broadcast-system
  labels:
    app.kubernetes.io/name: broadcast
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: broadcast
  template:
    metadata:
      labels:
        app.kubernetes.io/name: broadcast
    spec:
      serviceAccountName: broadcast
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: broadcast
          image: ghcr.io/goxang/broadcast:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
