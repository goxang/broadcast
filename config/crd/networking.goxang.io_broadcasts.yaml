apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: broadcasts.networking.goxang.io
spec:
  group: networking.goxang.io
  names:
    kind: Broadcast
    listKind: BroadcastList
    plural: broadcasts
    singular: broadcast
    shortNames:
      - bc
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Service
          type: string
          jsonPath: .spec.service.name
        - name: TargetPort
          type: integer
          jsonPath: .spec.service.targetPort
        - name: Timeout
          type: string
          jsonPath: .spec.timeout
        - name: Endpoints
          type: integer
          jsonPath: .status.endpoints
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: |-
            Broadcast fans a single HTTP request out to every ready endpoint of a
            Kubernetes Service. Delivery is best-effort: no acknowledgement, no
            retry, no ordering, and no delivery guarantee.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              description: Desired state of the broadcast.
              required:
                - service
              properties:
                service:
                  type: object
                  description: |-
                    The existing Service whose ready endpoints are fanned out to.
                    The Service is not created or owned by this resource.
                  required:
                    - name
                    - targetPort
                  properties:
                    name:
                      type: string
                      minLength: 1
                      description: Name of the Service in the Broadcast's namespace.
                    targetPort:
                      type: integer
                      minimum: 1
                      maximum: 65535
                      description: |-
                        Target port number the endpoints listen on. Matched against
                        the EndpointSlice endpoint port (the pod port), exactly like
                        a Service's targetPort. This is NOT the Service port.
                protocol:
                  type: string
                  description: Fan-out protocol. Only HTTP is supported in v1alpha1.
                  enum:
                    - HTTP
                  default: HTTP
                timeout:
                  type: string
                  description: |-
                    Bounds the entire fan-out operation. The proxy never waits
                    longer than this for target responses.
                  default: 1s
                  pattern: '^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$'
                concurrency:
                  type: integer
                  description: |-
                    Maximum number of target requests in flight at once for a
                    single broadcast.
                  minimum: 1
                  maximum: 1024
                  default: 16
            status:
              type: object
              description: Observed state of the broadcast.
              properties:
                endpoints:
                  type: integer
                  description: Number of ready endpoints currently resolved.
                observedGeneration:
                  type: integer
                  format: int64
                  description: Most recent generation observed by the controller.
                conditions:
                  type: array
                  description: Current reconciliation state.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                      - message
                    properties:
                      type:
                        type: string
                        description: Condition type. Currently only "Ready".
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
