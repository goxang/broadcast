apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: broadcast
  namespace: goxang-broadcast-system
rules:
  - apiGroups:
      - networking.goxang.io
    resources:
      - broadcasts
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - networking.goxang.io
    resources:
      - broadcasts/status
    verbs:
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch
