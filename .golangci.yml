# Pinned so a lint failure means the code changed, not that golangci-lint
# shipped a new default. Version bumps are a deliberate commit.
version: "2"

linters:
  # The standard set (errcheck, govet, ineffassign, staticcheck, unused) is
  # on by default; these are the additions.
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - revive
    - unconvert
    - usestdlibvars

  settings:
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    gocritic:
      enabled-tags: [diagnostic, style, performance]
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: error-strings

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Test fixtures deliberately contain odd shapes and unused members.
      - path: _test\.go
        linters: [unused, gocritic, revive]
      # The typed client mirrors the client-go clientset conventions, which
      # pass options structs by value. Deviating would make it stop looking
      # like every other Kubernetes client.
      - path: pkg/clientset/
        text: "hugeParam"
        linters: [gocritic]
      # Generated by controller-gen; not ours to restyle.
      - path: zz_generated.*\.go
        linters: [gocritic, revive, staticcheck]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
