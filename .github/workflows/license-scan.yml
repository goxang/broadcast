name: License Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run scanner
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67  # v2.5.1
        with:
          # Permissive licenses only. A dependency under anything else has to
          # be a deliberate decision, not something that arrives in a bump.
          scan-args: |-
            --licenses=Apache-2.0,0BSD,BSD-2-Clause,BSD-3-Clause,MIT,MIT-0,ISC,PSF-2.0,Python-2.0,UPL-1.0,X11,Zlib
            ./
