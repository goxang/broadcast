# Every replica is self-contained (own informers, resolver, and proxy) with no
# shared state or leader election. Scale horizontally by raising this value;
# requests are load-balanced across replicas by the Service.
replicaCount: 1

image:
  repository: ghcr.io/goxang/broadcast
  tag: latest
  pullPolicy: IfNotPresent

# The controller watches Broadcasts in the namespace it is deployed to (its own
# namespace). This is enforced via the POD_NAMESPACE downward API.
namespace: ""

# Fan-out defaults are per-Broadcast (see spec.concurrency/spec.timeout). These
# only affect the process-level limits.
maxBodyBytes: 1048576

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 8080

readinessProbe:
  path: /readyz
  port: http
  initialDelaySeconds: 2
  periodSeconds: 5

livenessProbe:
  path: /healthz
  port: http
  initialDelaySeconds: 5
  periodSeconds: 10
